<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:800px;overflow:hidden;font-family:Inter,sans-serif;background:#f4f1ea;color:#1b1b1b}
.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:2px solid #e2ddd2}
.top .day{font-size:30px;font-weight:700}
.top .clock{font-size:40px;font-weight:800}
.foot{position:absolute;bottom:0;left:0;right:0;height:104px;display:flex;gap:16px;padding:14px 20px;background:#fff;border-top:2px solid #e2ddd2}
.btn{flex:1;border-radius:18px;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:14px;color:#fff}
.call{background:#1f8a3b}.photos{background:#2f5fb3}.edit{background:#5b5b5b;flex:.7}
.cols{display:flex;gap:18px;padding:16px 20px;height:calc(800px - 76px - 104px)}
.col{flex:1;background:#fff;border-radius:20px;padding:16px 18px;overflow:hidden;border:3px solid transparent}
.gene{border-color:#2f5fb3}.peggy{border-color:#8a3fa8}
.name{font-size:36px;font-weight:800;margin-bottom:10px}
.gene .name{color:#2f5fb3}.peggy .name{color:#8a3fa8}
.done{font-size:24px;color:#1f8a3b;font-weight:700;padding:8px 0;border-bottom:2px solid #eee}
.wait{margin:10px 0;background:#fff4d6;border:2px solid #e0b100;border-radius:14px;padding:10px 14px;font-size:24px;font-weight:700}
.slot{font-size:26px;font-weight:800;margin:12px 0 6px;display:flex;justify-content:space-between}
.slot span{color:#666;font-weight:700}
.med{display:flex;align-items:center;gap:14px;padding:7px 0}
.box{width:50px;height:50px;border:4px solid #444;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;font-weight:900}
.box.on{background:#1f8a3b;border-color:#1f8a3b}
.mname{font-size:24px;font-weight:700;line-height:1.15}
.mdose{font-size:20px;color:#444}
.later{font-size:22px;color:#555;padding:8px 0;border-top:2px solid #eee;margin-top:8px}
.warn{background:#fde8e8;border:2px solid #c62828;color:#8e1515;border-radius:12px;padding:6px 10px;font-size:18px;font-weight:700;margin-top:4px}
.ph{background:linear-gradient(135deg,#d9a46a,#8d6e9e 55%,#4a7a9a);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-size:34px;font-weight:700}
.card{border-radius:18px;padding:14px 18px;background:#fff;margin-bottom:14px;border:3px solid}
.card .who{font-size:32px;font-weight:800}
.card .next{font-size:24px;margin-top:4px}
.card .big{margin-top:10px;height:64px;border-radius:14px;color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center}
.banner{position:absolute;left:24px;right:24px;bottom:24px;height:120px;border-radius:22px;background:#ffd34d;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:36px;font-weight:800;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.banner .go{background:#1b1b1b;color:#fff;border-radius:16px;padding:16px 28px;font-size:30px}
.tag{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:20px;font-weight:800;padding:6px 12px;border-radius:8px;z-index:9}
</style></head><body>
<div id="app"></div>
<script>
const v=new URLSearchParams(location.search).get('v')||'A';
const hdr=`<div class="top"><div class="day">Sunday, 22 November</div><div class="clock">8:15 am</div></div>`;
const foot=(p=true)=>`<div class="foot"><div class="btn call">📞 Call Tom</div>${p?'<div class="btn photos">Photos</div>':'<div class="btn photos">Meds</div>'}<div class="btn edit">Edit Meds</div></div>`;
const gene=`<div class="col gene"><div class="name">Gene</div>
<div class="done">✓ Wake up: done at 7:02</div>
<div class="wait">⏳ Next meds at <b>9:02</b> (2-hour wait)</div>
<div class="slot">Morning <span>9:02</span></div>
<div class="med"><div class="box"></div><div><div class="mname">Example med A 20 mg</div><div class="mdose">1 capsule · empty stomach</div></div></div>
<div class="med"><div class="box"></div><div><div class="mname">Example med B 25 mg</div><div class="mdose">3 tablets = 75 mg</div></div></div>
<div class="med"><div class="box"></div><div><div class="mname">Example med C 25 mg</div><div class="mdose">1 tablet</div></div></div>
<div class="med"><div class="box"></div><div><div class="mname">Example med D 5 mg</div><div class="mdose">1 tablet · after food</div></div></div>
<div class="later">Later: Dinner 6:00 pm (3) · Bedtime 8:30 pm (1)</div></div>`;
const peggy=`<div class="col peggy"><div class="name">Peggy</div>
<div class="slot">Morning <span>8:00</span></div>
<div class="med"><div class="box on">✓</div><div><div class="mname">Example med 10 mg</div><div class="mdose">1 tablet · taken 8:04</div></div></div>
<div class="med"><div class="box"></div><div><div class="mname">Example med 50 mg</div><div class="mdose">1 tablet · with food</div></div></div>
<div class="med"><div class="box"></div><div><div class="mname">Example vitamin</div><div class="mdose">1</div></div></div>
<div class="later">Later: Dinner 6:00 pm (2) · Bedtime 9:00 pm (1)</div>
<div class="mdose" style="margin-top:14px;font-style:italic">(Example meds until Peggy's list arrives)</div></div>`;
let h='';
if(v==='A'){h=`<div class="tag">A · Meds first</div>${hdr}<div class="cols">${gene}${peggy}</div>${foot(true)}`}
if(v==='B'){h=`<div class="tag">B · Photo + meds side panel</div>${hdr}<div class="cols"><div class="ph" style="flex:1.5;border-radius:20px">Family photo slideshow</div>
<div style="flex:1">
<div class="card" style="border-color:#2f5fb3"><div class="who" style="color:#2f5fb3">Gene</div><div class="next">✓ Wake up done 7:02</div><div class="next">Next: <b>Morning at 9:02</b> (4 meds)</div><div class="big" style="background:#2f5fb3">Open Gene's meds</div></div>
<div class="card" style="border-color:#8a3fa8"><div class="who" style="color:#8a3fa8">Peggy</div><div class="next">Now: <b>Morning</b>, 1 of 3 taken</div><div class="next">&nbsp;</div><div class="big" style="background:#8a3fa8">Open Peggy's meds</div></div>
</div></div>${foot(false)}`}
if(v==='C'){h=`<div class="tag">C · Photos full screen</div><div class="ph" style="position:absolute;inset:0">Family photo slideshow</div>
<div style="position:absolute;top:22px;left:28px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)"><div style="font-size:64px;font-weight:800">8:15 am</div><div style="font-size:30px;font-weight:700">Sunday, 22 November</div></div>
<div style="position:absolute;top:28px;right:28px;display:flex;gap:14px"><div class="btn call" style="padding:18px 26px;flex:none">📞 Call Tom</div></div>
<div class="banner"><div>💊 Peggy: Morning meds now</div><div class="go">Open meds</div></div>`}
document.getElementById('app').innerHTML=h;
</script></body></html>
