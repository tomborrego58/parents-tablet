<script>
(function () {
  var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  var state = {
    slots: [],
    meds: [],
    todayLogs: {},
    todayKey: '',
    config: {},
    history: [],
    todos: [],
    notes: [],
    photos: [],
    videos: [],
    activeVideo: null,
    todoWho: 'Gene',
    isListening: false,
    photoIdx: 0,
    view: 'photos',        // 'photos' | 'meds' | 'edit'
    editTab: 'list',       // 'list' | 'form' | 'history' | 'settings'
    editMed: null,
    deleteTarget: null,
    manualView: null,
    dismissedDueKey: '',
    audioUnlocked: false,
    lastChimedDueKey: '',
    snoozedUntilMs: 0,
    expandedSlots: {},
    showCallOthers: false
  };

  var toastTimer = null;
  var audioCtx = null;

  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('show');
    }, 2800);
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatClock(date) {
    var h = date.getHours();
    var m = String(date.getMinutes()).padStart(2, '0');
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12 || 12;
    return h12 + ':' + m + ' ' + ampm;
  }

  function formatHHMM12(hhmm) {
    if (!hhmm || hhmm.indexOf(':') === -1) return hhmm || '';
    var p = hhmm.split(':');
    var h = parseInt(p[0], 10);
    var ampm = h >= 12 ? 'pm' : 'am';
    return (h % 12 || 12) + ':' + p[1] + ' ' + ampm;
  }

  function formatDateLine(date) {
    return date.toLocaleDateString('en-US', {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric'
    });
  }

  function parseTodayTime(now, hhmm) {
    var p = (hhmm || '00:00').split(':');
    return new Date(now.getFullYear(), now.getMonth(), now.getDate(),
      parseInt(p[0], 10) || 0, parseInt(p[1], 10) || 0, 0, 0).getTime();
  }

  function isInQuietHours(now) {
    var cfg = state.config || {};
    var qs = (cfg.quietStart || '21:00').split(':');
    var qe = (cfg.quietEnd || '08:00').split(':');
    var cur = now.getHours() * 60 + now.getMinutes();
    var sMin = (parseInt(qs[0], 10) || 21) * 60 + (parseInt(qs[1], 10) || 0);
    var eMin = (parseInt(qe[0], 10) || 8) * 60 + (parseInt(qe[1], 10) || 0);
    if (sMin === eMin) return false;
    return sMin > eMin ? (cur >= sMin || cur < eMin) : (cur >= sMin && cur < eMin);
  }

  function unlockAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx && !audioCtx) audioCtx = new Ctx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      state.audioUnlocked = true;
    } catch (e) {}
  }

  function playChimeOnce(type) {
    if (type === 'voice' && window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance('Time for medications.');
      window.speechSynthesis.speak(u);
      return;
    }
    try {
      unlockAudio();
      if (!audioCtx) return;
      var notes = type === 'bell' ? [660, 880, 660] : [523.25, 659.25];
      var nowT = audioCtx.currentTime;
      notes.forEach(function (freq, idx) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type === 'bell' ? 'triangle' : 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, nowT + idx * 0.28);
        gain.gain.exponentialRampToValueAtTime(0.28, nowT + idx * 0.28 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, nowT + idx * 0.28 + 0.55);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(nowT + idx * 0.28);
        osc.stop(nowT + idx * 0.28 + 0.6);
      });
    } catch (e) {}
  }

  function maybePlayAlarm(dueKey, now) {
    if (!dueKey) {
      state.lastChimedDueKey = '';
      return;
    }
    if (now.getTime() < state.snoozedUntilMs) return;
    if (isInQuietHours(now)) return;
    if (state.lastChimedDueKey === dueKey) return;

    state.lastChimedDueKey = dueKey;
    var cfg = state.config || {};
    var type = cfg.soundType || 'chime';
    if (type === 'none') return;
    var repeat = cfg.soundRepeat !== undefined ? parseInt(cfg.soundRepeat, 10) : 1;
    playChimeOnce(type);
    for (var i = 1; i <= repeat; i++) {
      setTimeout(function () { playChimeOnce(type); }, i * 4500);
    }
  }

  function isMedScheduledToday(med, now) {
    if (!med || !med.freq || med.freq === 'prn') return false;
    if (med.freq === 'daily') return true;
    if (med.freq === 'weekly' || med.freq === 'days') {
      return Array.isArray(med.days) && med.days.indexOf(now.getDay()) !== -1;
    }
    return false;
  }

  function computePersonView(person, now) {
    var nowMs = now.getTime();
    var personSlots = state.slots
      .filter(function (s) { return s.person === person; })
      .sort(function (a, b) { return a.time.localeCompare(b.time); });
    var prnMeds = state.meds.filter(function (m) {
      return m.person === person && m.freq === 'prn';
    });

    var activeWaitUntil = 0;
    var activeWaitMinutes = 0;
    var doneSlots = [];
    var dueSlots = [];
    var laterSlots = [];

    personSlots.forEach(function (slot) {
      var slotMeds = state.meds.filter(function (m) {
        return m.person === person && m.slotId === slot.id && isMedScheduledToday(m, now);
      });
      if (!slotMeds.length) return;

      var allTicked = slotMeds.every(function (m) { return !!state.todayLogs[m.id]; });
      var maxTakenTs = 0;
      var lastTakenAt = '';
      slotMeds.forEach(function (m) {
        var log = state.todayLogs[m.id];
        if (log && log.ts >= maxTakenTs) {
          maxTakenTs = log.ts;
          lastTakenAt = log.takenAt;
        }
      });

      if (allTicked) {
        doneSlots.push({ slot: slot, takenAt: lastTakenAt, meds: slotMeds });
        if (slot.waitMinutes && maxTakenTs > 0) {
          var wu = maxTakenTs + slot.waitMinutes * 60000;
          if (nowMs < wu && wu > activeWaitUntil) {
            activeWaitUntil = wu;
            activeWaitMinutes = slot.waitMinutes;
          }
        }
        return;
      }

      var effMs = Math.max(parseTodayTime(now, slot.time), activeWaitUntil);
      var entry = {
        slot: slot,
        meds: slotMeds,
        effectiveMs: effMs,
        effectiveTimeStr: formatClock(new Date(effMs)),
        isDue: nowMs >= effMs
      };
      if (entry.isDue) dueSlots.push(entry);
      else laterSlots.push(entry);
    });

    var visibleSlots = dueSlots.slice();
    var remainingLater = laterSlots.slice();
    if (!visibleSlots.length && remainingLater.length) {
      visibleSlots.push(remainingLater.shift());
    }

    return {
      doneSlots: doneSlots,
      activeWaitUntil: activeWaitUntil,
      activeWaitMinutes: activeWaitMinutes,
      dueSlots: dueSlots,
      visibleSlots: visibleSlots,
      laterSlots: remainingLater,
      prnMeds: prnMeds
    };
  }

  function updateAutoView(geneView, peggyView) {
    var dueIds = [];
    geneView.dueSlots.forEach(function (d) { dueIds.push('g:' + d.slot.id); });
    peggyView.dueSlots.forEach(function (d) { dueIds.push('p:' + d.slot.id); });
    var dueKey = dueIds.join(',');

    if (state.view === 'edit' || state.view === 'todo' || state.view === 'call' || state.view === 'settings') {
      return dueKey;
    }

    if (dueKey) {
      if (state.manualView === 'photos' && state.dismissedDueKey === dueKey) {
        state.view = 'photos';
      } else {
        state.manualView = null;
        state.dismissedDueKey = '';
        state.view = 'meds';
      }
    } else {
      state.dismissedDueKey = '';
      state.view = state.manualView === 'meds' ? 'meds' : 'photos';
    }
    return dueKey;
  }

  function formatMedQtyFirst(med) {
    var dose = String(med.dose || '').trim();
    var strength = String(med.strength || '').trim();
    var name = String(med.name || '').trim();
    var m = dose.match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
    if (!m) {
      return name + (strength ? ', ' + strength : '') + (dose ? ', ' + dose : '');
    }
    var qty = m[1];
    var rest = m[2].trim();
    var totalMatch = rest.match(/^(.*?)=\s*(.+)$/);
    var unit = totalMatch ? totalMatch[1].trim() : rest;
    var total = totalMatch ? totalMatch[2].trim() : '';

    // Normalize plural unit to singular when strength is present (e.g. "tablets" -> "tablet")
    var unitSingular = unit.replace(/s$/i, '');
    if (unitSingular.toLowerCase().indexOf('spray') === 0) {
      unit = unit.replace(/^sprays?\s*/i, '').trim();
    } else if (strength) {
      unit = unitSingular;
    }

    var out = qty + 'x ' + name;
    var tail = [];
    if (strength && unit) tail.push(strength + ' ' + unit);
    else if (strength) tail.push(strength);
    else if (unit) tail.push(unit);
    if (tail.length) out += ', ' + tail.join(' ');
    if (total) out += ' (' + total + ' total)';
    return out;
  }

  function renderMedRow(med, isPrn) {
    var log = state.todayLogs[med.id];
    var useQtyFirst = !state.config || state.config.medFormat !== 'classic';
    var details = [];
    if (!useQtyFirst && med.dose) details.push(med.dose);
    if (med.note) details.push(med.note);
    if (log && log.takenAt) details.push((isPrn ? 'last used ' : 'taken ') + formatHHMM12(log.takenAt));
    var title = useQtyFirst
      ? formatMedQtyFirst(med)
      : (med.name + (med.strength ? ' ' + med.strength : ''));
    var warnHtml = med.warning ? '<div class="warn">⚠ ' + esc(med.warning) + '</div>' : '';

    return (
      '<div class="med" data-med-id="' + esc(med.id) + '">' +
        '<div class="box' + (log ? ' on' : '') + '">' + (log ? '✓' : '') + '</div>' +
        '<div class="med-body">' +
          '<div class="med-line">' +
            '<div class="mname">' + esc(title) + '</div>' +
            (details.length ? '<div class="mdose">' + esc(details.join(' · ')) + '</div>' : '') +
          '</div>' +
          warnHtml +
        '</div>' +
      '</div>'
    );
  }

  function renderColumn(person, label, pView) {
    var html = '<div class="col ' + person + '">' +
      '<div class="col-head">' +
        '<div class="name">' + label + '</div>' +
        '<button type="button" class="clear-btn" data-clear-person="' + person + '">Clear</button>' +
      '</div>';
    if (!pView.doneSlots.length && !pView.visibleSlots.length && !pView.laterSlots.length && !pView.prnMeds.length) {
      return html + '<div class="empty-msg">No medications scheduled yet. Tap Edit Meds below to add.</div></div>';
    }
    pView.doneSlots.forEach(function (d) {
      var expKey = person + ':' + d.slot.id;
      var isExp = !!state.expandedSlots[expKey];
      html +=
        '<div class="done-row">' +
          '<div class="done-text"><span class="done-check">✓</span> ' + esc(d.slot.name) + ' - <span style="color:#1f8a3b">Completed</span> at ' + esc(formatHHMM12(d.takenAt)) + '</div>' +
          '<button type="button" class="expand-btn" data-toggle-expand="' + esc(expKey) + '">' + (isExp ? '- Collapse' : '+ Expand') + '</button>' +
        '</div>';
      if (isExp && d.meds && d.meds.length) {
        html += '<div class="done-list">';
        d.meds.forEach(function (m) {
          var title = m.name + (m.strength ? ' ' + m.strength : '');
          html +=
            '<div class="done-med" data-med-id="' + esc(m.id) + '">' +
              '<span class="done-check">✓</span>' +
              '<span class="mname">' + esc(title) + '</span>' +
            '</div>';
        });
        html += '</div>';
      }
    });
    if (pView.activeWaitUntil > 0) {
      var hrs = Math.round(pView.activeWaitMinutes / 60 * 10) / 10;
      var wl = hrs === 2 ? '2-hour wait' : (pView.activeWaitMinutes + '-min wait');
      html += '<div class="wait">⏳ Next meds at <b>' + esc(formatClock(new Date(pView.activeWaitUntil))) + '</b> (' + esc(wl) + ')</div>';
    }
    pView.visibleSlots.forEach(function (entry) {
      html += '<div class="slot">' + esc(entry.slot.name) + ' <span>' + esc(entry.effectiveTimeStr) + '</span></div>';
      if (entry.slot.note) html += '<div class="slot-note">' + esc(entry.slot.note) + '</div>';
      entry.meds.forEach(function (m) { html += renderMedRow(m, false); });
    });
    if (pView.laterSlots.length) {
      var parts = pView.laterSlots.map(function (l) {
        return esc(l.slot.name) + ' ' + esc(l.effectiveTimeStr) + ' (' + l.meds.length + ')';
      });
      html += '<div class="later">Later: ' + parts.join(' · ') + '</div>';
    }
    if (pView.prnMeds.length) {
      html += '<div class="prn-wrap"><div class="prn-title">As Needed</div>';
      pView.prnMeds.forEach(function (m) { html += renderMedRow(m, true); });
      html += '</div>';
    }
    return html + '</div>';
  }

  function renderEditScreen() {
    var tab = state.editTab;
    var tabsHtml =
      '<div class="tabs">' +
        '<button class="tab' + (tab === 'list' ? ' on' : '') + '" data-tab="list">Med List &amp; Times</button>' +
        '<button class="tab' + (tab === 'form' ? ' on' : '') + '" data-tab="form">' + (state.editMed && state.editMed.id ? 'Edit Med' : '+ Add Med') + '</button>' +
        '<button class="tab' + (tab === 'history' ? ' on' : '') + '" data-tab="history">History</button>' +
        '<button class="tab' + (tab === 'settings' ? ' on' : '') + '" data-tab="settings">Settings</button>' +
      '</div>';

    var body = '';
    if (tab === 'list') body = renderEditListTab();
    else if (tab === 'form') body = renderEditFormTab();
    else if (tab === 'history') body = renderHistoryTab();
    else if (tab === 'settings') body = renderSettingsTab();

    var dlgHtml = '';
    if (state.deleteTarget) {
      dlgHtml =
        '<div class="dlg"><div class="c">' +
          '<div class="q">Delete ' + esc(state.deleteTarget.name) + '?</div>' +
          '<div class="s">Are you sure? Tom will get an email, and you can undo from History.</div>' +
          '<div class="bb">' +
            '<button class="btn edit" id="dlg-cancel">Cancel</button>' +
            '<button class="btn red" id="dlg-confirm">Yes, Delete</button>' +
          '</div>' +
        '</div></div>';
    }

    return (
      '<div class="screen-edit">' +
        '<div class="top"><div class="day">Edit Medications</div>' +
          '<div style="display:flex;gap:10px">' +
            '<button class="sm-btn green" id="btn-save-exit">Save and Exit</button>' +
            '<button class="sm-btn" style="background:#5b5b5b" id="btn-exit">Exit</button>' +
          '</div>' +
        '</div>' +
        tabsHtml +
        '<div class="edit-body">' + body + '</div>' +
        dlgHtml +
      '</div>'
    );
  }

  function renderEditListTab() {
    var html = '<div class="sec-title">Alarm Times</div>';
    ['gene', 'peggy'].forEach(function (person) {
      var label = person === 'gene' ? 'Gene' : 'Peggy';
      var pSlots = state.slots.filter(function (s) { return s.person === person; })
        .sort(function (a, b) { return a.time.localeCompare(b.time); });
      pSlots.forEach(function (s) {
        html +=
          '<div class="item">' +
            '<div class="n">' + label + ' — ' + esc(s.name) + '</div>' +
            '<input type="time" class="field" style="width:180px" id="slot-time-' + esc(s.id) + '" value="' + esc(s.time) + '">' +
            '<button class="sm-btn green" data-save-slot="' + esc(s.id) + '">Save Time</button>' +
          '</div>';
      });
    });

    ['gene', 'peggy'].forEach(function (person) {
      var label = person === 'gene' ? "Gene's Medications" : "Peggy's Medications";
      html += '<div class="sec-title">' + label + '</div>';
      var pMeds = state.meds.filter(function (m) { return m.person === person; });
      if (!pMeds.length) html += '<div class="empty-msg">No medications yet.</div>';
      pMeds.forEach(function (m) {
        var slot = state.slots.find(function (s) { return s.id === m.slotId; });
        var sub = [m.strength, m.dose, m.freq === 'prn' ? 'As Needed' : (slot ? slot.name : ''), m.note].filter(Boolean).join(' · ');
        html +=
          '<div class="item">' +
            '<div class="n">' + esc(m.name) + '<div class="d">' + esc(sub) + '</div></div>' +
            '<button class="sm-btn blue" data-edit-med="' + esc(m.id) + '">Edit</button>' +
            '<button class="sm-btn red" data-del-med="' + esc(m.id) + '">Delete</button>' +
          '</div>';
      });
    });
    return html;
  }

  function renderEditFormTab() {
    var m = state.editMed || { person: 'gene', slotId: '', name: '', strength: '', dose: '', note: '', warning: '', freq: 'daily', days: [] };
    var pSlots = state.slots.filter(function (s) { return s.person === m.person; })
      .sort(function (a, b) { return a.time.localeCompare(b.time); });
    if (!m.slotId && pSlots.length && m.freq !== 'prn') m.slotId = pSlots[0].id;

    var slotsHtml = pSlots.map(function (s) {
      return '<button type="button" class="pill' + (m.slotId === s.id ? ' on' : '') + '" data-form-slot="' + esc(s.id) + '">' +
        esc(s.name) + ' (' + esc(formatHHMM12(s.time)) + ')</button>';
    }).join('');

    var freqs = [
      { k: 'daily', l: 'Every day' },
      { k: 'weekly', l: 'Once a week' },
      { k: 'days', l: 'Specific days' },
      { k: 'prn', l: 'As Needed' }
    ];
    var freqHtml = freqs.map(function (f) {
      return '<button type="button" class="pill' + (m.freq === f.k ? ' on' : '') + '" data-form-freq="' + f.k + '">' + f.l + '</button>';
    }).join('');

    var daysHtml = '';
    if (m.freq === 'weekly' || m.freq === 'days') {
      daysHtml = '<div class="lbl">Which day(s)?</div><div>' +
        DAY_NAMES.map(function (dn, idx) {
          var on = Array.isArray(m.days) && m.days.indexOf(idx) !== -1;
          return '<button type="button" class="pill' + (on ? ' on' : '') + '" data-form-day="' + idx + '">' + dn + '</button>';
        }).join('') + '</div>';
    }

    return (
      '<div class="who">' +
        '<button type="button" class="g' + (m.person === 'gene' ? ' on' : '') + '" data-form-person="gene">Gene</button>' +
        '<button type="button" class="pg' + (m.person === 'peggy' ? ' on' : '') + '" data-form-person="peggy">Peggy</button>' +
      '</div>' +
      '<div class="row">' +
        '<div><div class="lbl">Medication Name</div><input class="field" id="f-name" value="' + esc(m.name) + '" placeholder="e.g. Lisinopril"></div>' +
        '<div><div class="lbl">Strength</div><input class="field" id="f-strength" value="' + esc(m.strength) + '" placeholder="e.g. 20 mg"></div>' +
      '</div>' +
      '<div class="row">' +
        '<div><div class="lbl">How much to take</div><input class="field" id="f-dose" value="' + esc(m.dose) + '" placeholder="e.g. 1 tablet"></div>' +
        '<div><div class="lbl">Note (optional)</div><input class="field" id="f-note" value="' + esc(m.note) + '" placeholder="e.g. after food"></div>' +
      '</div>' +
      '<div class="lbl">Red Warning Note (optional)</div>' +
      '<input class="field" id="f-warning" value="' + esc(m.warning) + '" placeholder="e.g. Check HR before taking">' +
      '<div class="lbl">Schedule</div><div>' + freqHtml + '</div>' +
      daysHtml +
      (m.freq !== 'prn' ? '<div class="lbl">Time Slot</div><div>' + slotsHtml + '</div>' : '') +
      '<div style="margin-top:20px;display:flex;gap:14px">' +
        '<button class="btn call" style="height:76px" id="btn-save-med">Save Medication</button>' +
      '</div>'
    );
  }

  function renderHistoryTab() {
    if (!state.history || !state.history.length) {
      return '<div class="empty-msg">No changes recorded yet.</div>';
    }
    return state.history.map(function (h) {
      return (
        '<div class="hist">' +
          '<div><b>' + esc(h.summary) + '</b><div class="d">' + esc(h.dateKey) + ' at ' + esc(formatHHMM12(h.timeStr)) + '</div></div>' +
          (h.undone
            ? '<span style="color:#666;font-weight:700">Undone</span>'
            : '<button class="sm-btn amber" data-undo="' + esc(h.id) + '">Undo</button>') +
        '</div>'
      );
    }).join('');
  }

  function getMeetContactsFromConfig(c) {
    if (Array.isArray(c.meetContacts) && c.meetContacts.length) {
      return c.meetContacts;
    }
    return [
      { name: 'Tom', url: c.meetUrlTom || '' },
      { name: 'Katie', url: c.meetUrlKatie || '' },
      { name: 'Matt', url: c.meetUrlMatt || '' },
      { name: 'Laura', url: c.meetUrlLaura || '' }
    ];
  }

  function renderSettingsTab() {
    var c = state.config || {};
    var sumTime = c.dailySummaryTime || ((c.dailySummaryHour !== undefined ? String(c.dailySummaryHour).padStart(2, '0') : '21') + ':00');
    var contacts = getMeetContactsFromConfig(c);
    var meetRowsHtml = contacts.map(function (mc, idx) {
      return (
        '<div class="meet-row" data-meet-idx="' + idx + '">' +
          '<input class="field name-in" data-meet-name="' + idx + '" value="' + esc(mc.name) + '" placeholder="Name">' +
          '<input class="field url-in" data-meet-url="' + idx + '" value="' + esc(mc.url) + '" placeholder="https://meet.google.com/...">' +
          '<input class="field photo-in" data-meet-photo="' + idx + '" value="' + esc(mc.photoUrl || '') + '" placeholder="Photo URL (optional)">' +
          (idx >= 4 ? '<button type="button" class="sm-btn red" data-del-meet="' + idx + '">✕</button>' : '') +
        '</div>'
      );
    }).join('');

    return (
      '<div class="settings-grid">' +
        '<div class="settings-col">' +
          '<div class="lbl">Tom Alert Email</div><input class="field" id="s-alertEmail" value="' + esc(c.alertEmail) + '">' +
          '<div class="lbl">Katie Alert Email</div><input class="field" id="s-katieEmail" value="' + esc(c.katieEmail) + '">' +

  function parseSmartTodo(raw, who, nowOpt) {
    var now = nowOpt || new Date();
    var text = String(raw || '').trim();
    if (!text) return { formatted: '', sortTs: Number.MAX_SAFE_INTEGER };

    var lower = text.toLowerCase();
    var targetDate = null;
    var dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

    if (/\btoday\b/.test(lower)) {
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    } else if (/\btomorrow\b/.test(lower)) {
      targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    } else {
      for (var d = 0; d < 7; d++) {
        if (new RegExp('\\b' + dayNames[d] + '\\b', 'i').test(lower)) {
          var diff = (d - now.getDay() + 7) % 7;
          if (diff === 0) diff = 7;
          targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
          break;
        }
      }
    }

    var timeLabel = '';
    var timeHour = 9;
    var timeMin = 0;
    var tm = lower.match(/\b(by|before|nlt|at)?\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
    if (tm && (tm[1] || tm[4] || tm[3])) {
      var h = parseInt(tm[2], 10);
      var m = parseInt(tm[3] || '0', 10);
      if (tm[4] === 'pm' && h < 12) h += 12;
      if (tm[4] === 'am' && h === 12) h = 0;
      timeHour = h;
      timeMin = m;
      var hhmm = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
      var isNlt = tm[1] === 'by' || tm[1] === 'before' || tm[1] === 'nlt';
      timeLabel = (isNlt ? 'NLT ' : '') + hhmm;
    }

    var clean = text
      .replace(/^(we need to|i need to|need to|remember to|please)\s+/i, '')
      .replace(/\b(on\s+)?(today|tomorrow|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi, '')
      .replace(/\b(by|before|nlt|at)\s*\d{1,2}(?::\d{2})?\s*(?:am|pm)?\b/gi, '')
      .replace(/\s{2,}/g, ' ')
      .replace(/^[\s,.-]+|[\s,.-]+$/g, '');
    if (!clean) clean = text;
    clean = clean.charAt(0).toUpperCase() + clean.slice(1);

    var prefix = [];
    var sortTs = Number.MAX_SAFE_INTEGER;
    if (targetDate) {
      prefix.push(targetDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }));
      sortTs = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate(), timeHour, timeMin).getTime();
    }
    if (timeLabel) prefix.push(timeLabel);

    var whoTag = who ? ' (' + who + ')' : '';
    var formatted = (prefix.length ? prefix.join(' · ') + ' — ' : '') + clean + whoTag;
    return { formatted: formatted, sortTs: sortTs };
  }

    document.querySelectorAll('[data-toggle-expand]').forEach(function (el) {

    document.querySelectorAll('[data-clear-person]').forEach(function (el) {
      el.addEventListener('click', function () {
        var person = el.getAttribute('data-clear-person');
        var who = person === 'peggy' ? 'Peggy' : 'Gene';
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.withSuccessHandler(function (res) {

              state.todayLogs = res.todayLogs;
              state.todayKey = res.todayKey;
              render();

    var unlockEl = document.getElementById('btn-unlock-sound');
    if (unlockEl) unlockEl.addEventListener('click', function () { unlockAudio(); render(); showToast('Sound enabled'); });

        if (target === 'photos') {
          state.manualView = 'photos';
          state.dismissedDueKey = dueKey;
        } else if (target === 'meds') {
          state.manualView = 'meds';
        }
        state.view = target;
        render();
      });
    });

    document.querySelectorAll('[data-call-extra]').forEach(function (el) {
      el.addEventListener('click', function () {
        var name = el.getAttribute('data-call-extra');
        var url = el.getAttribute('data-call-url');
        state.showCallOthers = false;
        render();
        triggerCall(name, url);
      });
    });

    var editBtn = document.getElementById('btn-edit');
    if (editBtn) editBtn.addEventListener('click', function () {
      unlockAudio();
      state.view = 'edit';
      state.editTab = 'list';
      render();
    });

    var settingsBtn = document.getElementById('btn-settings');
    if (settingsBtn) settingsBtn.addEventListener('click', function () {
      unlockAudio();
      state.view = 'edit';
      state.editTab = 'settings';
      render();
    });

    var saveExitBtn = document.getElementById('btn-save-exit');
    if (saveExitBtn) saveExitBtn.addEventListener('click', function () {
      if (state.editTab === 'form' && state.editMed) {
        syncFormInputs();
        if (state.editMed.name && state.editMed.name.trim()) {
          google.script.run.withSuccessHandler(function (res) {
            applyStateResponse(res);
            state.editMed = null;
            state.view = 'meds';
            state.manualView = 'meds';
            render();
            showToast('Medication saved');
          }).apiSaveMed(state.editMed);
          return;
        }
      }
      if (state.editTab === 'settings') {
        saveSettingsFromDom(false);
      }
      state.editMed = null;
      state.view = 'meds';
      state.manualView = 'meds';
      render();
    });

    var exitBtn = document.getElementById('btn-exit');
    if (exitBtn) exitBtn.addEventListener('click', function () {
      state.editMed = null;
      state.view = 'meds';
      state.manualView = 'meds';
      render();
    });

    document.querySelectorAll('[data-tab]').forEach(function (el) {
      el.addEventListener('click', function () {
        var t = el.getAttribute('data-tab');
        if (t === 'form' && !state.editMed) {
          state.editMed = { person: 'gene', slotId: '', name: '', strength: '', dose: '', note: '', warning: '', freq: 'daily', days: [] };
        }
        state.editTab = t;
        render();
      });
    });

    document.querySelectorAll('[data-save-slot]').forEach(function (el) {
      el.addEventListener('click', function () {
        var sid = el.getAttribute('data-save-slot');
        var inp = document.getElementById('slot-time-' + sid);
        if (!inp || !inp.value) return;
        google.script.run.withSuccessHandler(function (res) {
          applyStateResponse(res);
          render();
          showToast('Time saved');
        }).apiSaveSlot({ id: sid, time: inp.value });
      });
    });

    document.querySelectorAll('[data-edit-med]').forEach(function (el) {
      el.addEventListener('click', function () {
        var mid = el.getAttribute('data-edit-med');
        var found = state.meds.find(function (m) { return m.id === mid; });
        if (!found) return;
        state.editMed = JSON.parse(JSON.stringify(found));
        state.editTab = 'form';
        render();
      });
    });

    document.querySelectorAll('[data-del-med]').forEach(function (el) {
      el.addEventListener('click', function () {
        var mid = el.getAttribute('data-del-med');
        state.deleteTarget = state.meds.find(function (m) { return m.id === mid; }) || null;
        render();
      });
    });

    var dlgCancel = document.getElementById('dlg-cancel');
    if (dlgCancel) dlgCancel.addEventListener('click', function () { state.deleteTarget = null; render(); });

    var dlgConfirm = document.getElementById('dlg-confirm');
    if (dlgConfirm) dlgConfirm.addEventListener('click', function () {
      var target = state.deleteTarget;
      state.deleteTarget = null;
      if (!target) return;
      google.script.run.withSuccessHandler(function (res) {
        applyStateResponse(res);
        render();
        showToast('Deleted ' + target.name);
      }).apiDeleteMed(target.id);
    });

    document.querySelectorAll('[data-form-person]').forEach(function (el) {
      el.addEventListener('click', function () {
        syncFormInputs();
        state.editMed.person = el.getAttribute('data-form-person');
        state.editMed.slotId = '';
        render();
      });
    });

    document.querySelectorAll('[data-form-slot]').forEach(function (el) {
      el.addEventListener('click', function () {
        syncFormInputs();
        state.editMed.slotId = el.getAttribute('data-form-slot');
        render();
      });
    });

    document.querySelectorAll('[data-form-freq]').forEach(function (el) {
      el.addEventListener('click', function () {
        syncFormInputs();
        state.editMed.freq = el.getAttribute('data-form-freq');
        if (!Array.isArray(state.editMed.days)) state.editMed.days = [];
        render();
      });
    });

    document.querySelectorAll('[data-form-day]').forEach(function (el) {
      el.addEventListener('click', function () {
        syncFormInputs();
        var d = parseInt(el.getAttribute('data-form-day'), 10);
        var arr = Array.isArray(state.editMed.days) ? state.editMed.days : [];
        if (state.editMed.freq === 'weekly') {
          state.editMed.days = [d];
        } else {
          var idx = arr.indexOf(d);
          if (idx >= 0) arr.splice(idx, 1);
          else arr.push(d);
          state.editMed.days = arr;
        }
        render();
      });
    });

    var saveMedBtn = document.getElementById('btn-save-med');
    if (saveMedBtn) saveMedBtn.addEventListener('click', function () {
      syncFormInputs();
      if (!state.editMed.name.trim()) { showToast('Please enter a medication name'); return; }
      google.script.run.withSuccessHandler(function (res) {
        applyStateResponse(res);
        state.editMed = null;
        state.editTab = 'list';
        render();
        showToast('Medication saved');
      }).apiSaveMed(state.editMed);
    });

    document.querySelectorAll('[data-undo]').forEach(function (el) {
      el.addEventListener('click', function () {
        var hid = el.getAttribute('data-undo');
        google.script.run.withSuccessHandler(function (res) {
          applyStateResponse(res);
          render();
          showToast('Change undone');
        }).apiUndoHistory(hid);
      });
    });

    document.querySelectorAll('[data-todo-who]').forEach(function (el) {
      el.addEventListener('click', function () {
        state.todoWho = el.getAttribute('data-todo-who');
        render();
      });
    });

    var voiceBtn = document.getElementById('btn-voice-todo');
    if (voiceBtn) voiceBtn.addEventListener('click', function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showToast('Voice input not supported in this browser'); return; }
      var rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      state.isListening = true;
      render();
      rec.onresult = function (ev) {
        state.isListening = false;
        var transcript = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : '';
        if (transcript) {
          addSmartTodo(transcript);
        } else {
          render();
        }
      };
      rec.onerror = function () {
        state.isListening = false;
        render();
        showToast('Could not hear voice — try again');
      };
      rec.start();
    });

    var addTodoBtn = document.getElementById('btn-add-todo');
    if (addTodoBtn) addTodoBtn.addEventListener('click', function () {
      var inp = document.getElementById('todo-input');
      if (!inp || !inp.value.trim()) return;
      addSmartTodo(inp.value.trim());
    });

    var watchBtn = document.getElementById('btn-watch-video');
    if (watchBtn) watchBtn.addEventListener('click', function () {
      if (state.videos && state.videos.length) {
        state.activeVideo = state.videos[0];
        render();
      }
    });

    var closeVidBtn = document.getElementById('btn-close-video');
    if (closeVidBtn) closeVidBtn.addEventListener('click', function () {
      state.activeVideo = null;
      render();
    });

    var markVidBtn = document.getElementById('btn-mark-watched');
    if (markVidBtn) markVidBtn.addEventListener('click', function () {
      var v = state.activeVideo;
      state.activeVideo = null;
      if (v) {
        state.videos = state.videos.filter(function (x) { return x.id !== v.id; });
        render();
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.apiMarkVideoWatched(v.id);
        }
      } else {
        render();
      }
    });

    document.querySelectorAll('[data-toggle-todo]').forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-toggle-todo'), 10);
        if (state.todos[idx]) {
          state.todos[idx].done = !state.todos[idx].done;
          render();
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run.apiSaveTodos(state.todos);
          }
        }
      });
    });

    document.querySelectorAll('[data-del-todo]').forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-del-todo'), 10);
        state.todos.splice(idx, 1);
        render();
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.apiSaveTodos(state.todos);
        }
      });
    });

    var addNoteBtn = document.getElementById('btn-add-note');
    if (addNoteBtn) addNoteBtn.addEventListener('click', function () {
      var inp = document.getElementById('note-input');
      if (!inp || !inp.value.trim()) return;
      var d = new Date();
      state.notes.unshift({ text: inp.value.trim(), date: formatDateLine(d) + ' ' + formatClock(d) });
      render();
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.apiSaveNotes(state.notes);
      }
    });

    document.querySelectorAll('[data-del-note]').forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-del-note'), 10);
        state.notes.splice(idx, 1);
        render();
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.apiSaveNotes(state.notes);
        }
      });
    });

    document.querySelectorAll('[id^="s-"], [data-meet-name], [data-meet-url], [data-meet-photo]').forEach(function (el) {
      el.addEventListener('change', function () {
        saveSettingsFromDom(true);
      });
    });

    var addMeetBtn = document.getElementById('btn-add-meet');
    if (addMeetBtn) addMeetBtn.addEventListener('click', function () {
      var contacts = readMeetContactsFromDom();
      contacts.push({ name: '', url: '', photoUrl: '' });
      state.config.meetContacts = contacts;
      render();
    });

    document.querySelectorAll('[data-del-meet]').forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-del-meet'), 10);
        var contacts = readMeetContactsFromDom();
        contacts.splice(idx, 1);
        state.config.meetContacts = contacts;
        saveSettingsFromDom(true);
        render();
      });
    });
  }

  function readMeetContactsFromDom() {
    var rows = document.querySelectorAll('[data-meet-idx]');
    var list = [];
    rows.forEach(function (row) {
      var n = row.querySelector('[data-meet-name]');
      var u = row.querySelector('[data-meet-url]');
      var p = row.querySelector('[data-meet-photo]');
      list.push({
        name: n ? n.value.trim() : '',
        url: u ? u.value.trim() : '',
        photoUrl: p ? p.value.trim() : ''
      });
    });
    return list;
  }

  function addSmartTodo(rawText) {
    var parsed = parseSmartTodo(rawText, state.todoWho);
    if (!parsed.formatted) return;
    state.todos.push({ text: parsed.formatted, done: false, sortTs: parsed.sortTs });
    state.todos.sort(function (a, b) {
      return (a.sortTs || Number.MAX_SAFE_INTEGER) - (b.sortTs || Number.MAX_SAFE_INTEGER);
    });
    render();
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.apiSaveTodos(state.todos);
    }
  }

  function saveSettingsFromDom(keepEditView) {
    if (!document.getElementById('s-alertEmail')) return;
    var contacts = readMeetContactsFromDom();
    var findUrl = function (label, fallbackIdx) {
      var found = contacts.find(function (c) { return c.name.toLowerCase() === label; });
      if (found) return found.url;
      return contacts[fallbackIdx] ? contacts[fallbackIdx].url : '';
    };
    var payload = {
      alertEmail: document.getElementById('s-alertEmail').value.trim(),
      smsGatewayEmail: document.getElementById('s-smsGatewayEmail').value.trim(),
      katieEmail: document.getElementById('s-katieEmail').value.trim(),
      driveFolderId: document.getElementById('s-driveFolderId').value.trim(),
      videoFolderId: document.getElementById('s-videoFolderId').value.trim(),
      doctorName: document.getElementById('s-doctorName').value.trim(),
      doctorPhone: document.getElementById('s-doctorPhone').value.trim(),
      meetContacts: contacts,
      meetUrlTom: findUrl('tom', 0),
      meetUrlKatie: findUrl('katie', 1),
      meetUrlMatt: findUrl('matt', 2),
      meetUrlLaura: findUrl('laura', 3),
      quietStart: document.getElementById('s-quietStart').value,
      quietEnd: document.getElementById('s-quietEnd').value,
      missedDelayMin: parseInt(document.getElementById('s-missedDelayMin').value, 10) || 120,
      dailySummaryTime: document.getElementById('s-dailySummaryTime').value || '21:00',
      theme: document.getElementById('s-theme').value,
      medFormat: document.getElementById('s-medFormat').value,
      soundType: document.getElementById('s-soundType').value,
      snoozeMin: parseInt(document.getElementById('s-snoozeMin').value, 10) || 10
    };
    state.config = Object.assign({}, state.config, payload);
    if (keepEditView) {
      document.body.classList.toggle('dark', payload.theme === 'dark');
    }
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function (cfg) {
        state.config = cfg;
        loadPhotos();
        showToast('Saved');
      }).apiSaveConfig(payload);
    }
  }

  function triggerCall(who, customUrl) {
    unlockAudio();
    var label = who ? (who.charAt(0).toUpperCase() + who.slice(1)) : 'Tom';
    showToast('Calling ' + label + '…');
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function (res) {
        if (res && res.meetUrl) {
          window.open(res.meetUrl, '_blank');
        } else {
          showToast('Alert sent to ' + label + ' (add Meet URL in Settings)');
        }
      }).apiNotifyCall(who, customUrl || '');
    }
  }

  function onMedTap(e) {
    unlockAudio();
    var medId = e.currentTarget.getAttribute('data-med-id');
    if (!medId) return;
    var prev = state.todayLogs[medId];
    var now = new Date();
    if (prev) delete state.todayLogs[medId];
    else state.todayLogs[medId] = {
      takenAt: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),
      ts: now.getTime()
    };
    render();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.todayLogs) {
            state.todayLogs = res.todayLogs;
            state.todayKey = res.todayKey;
            render();
          }
        })
        .withFailureHandler(function () {
          if (prev) state.todayLogs[medId] = prev;
          else delete state.todayLogs[medId];
          render();
          showToast('Could not save — please tap again');
        })
        .apiToggleDose(medId, state.todayKey);
    }
  }

  function loadPhotos() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function (list) {
        state.photos = list || [];
        if (state.view === 'photos') render();
      }).apiGetPhotos();
    }
  }

  function loadVideos() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function (list) {
        state.videos = list || [];
        if (state.view === 'meds' || state.view === 'photos') render();
      }).apiGetVideos();
    }
  }

  function loadState() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function (res) {
        applyStateResponse(res);
        render();
      }).apiGetState();
    } else {
      render();
    }
  }

  loadState();
  loadPhotos();
  loadVideos();
  setInterval(function () {
    if (state.view !== 'edit') render();
  }, 15000);
  setInterval(function () {
    if (state.view === 'photos' && state.photos.length > 1) {
      state.photoIdx = (state.photoIdx + 1) % state.photos.length;
      render();
    }
  }, 15000);
  setInterval(loadState, 60000);
  setInterval(loadPhotos, 300000);
  setInterval(loadVideos, 300000);
})();
</script>
