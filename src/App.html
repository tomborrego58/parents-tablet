<script>
(function () {
  var state = {
    slots: [],
    meds: [],
    todayLogs: {},
    todayKey: '',
    view: 'photos',        // 'photos' (Screen C) or 'meds' (Screen A)
    manualView: null,      // 'photos' | 'meds' | null
    dismissedDueKey: ''    // tracks which due-slot set user manually switched away from
  };

  var toastTimer = null;

  function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('show');
    }, 2600);
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatClock(date) {
    var h = date.getHours();
    var m = String(date.getMinutes()).padStart(2, '0');
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12 || 12;
    return h12 + ':' + m + ' ' + ampm;
  }

  function formatHHMM12(hhmm) {
    if (!hhmm || hhmm.indexOf(':') === -1) return hhmm || '';
    var parts = hhmm.split(':');
    var h = parseInt(parts[0], 10);
    var m = parts[1];
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12 || 12;
    return h12 + ':' + m + ' ' + ampm;
  }

  function formatDateLine(date) {
    return date.toLocaleDateString('en-US', {
      weekday: 'long',
      day: 'numeric',
      month: 'long'
    });
  }

  function parseTodayTime(now, hhmm) {
    var parts = (hhmm || '00:00').split(':');
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
      parseInt(parts[0], 10) || 0, parseInt(parts[1], 10) || 0, 0, 0);
    return d.getTime();
  }

  function isMedScheduledToday(med, now) {
    if (!med || !med.freq) return false;
    if (med.freq === 'daily') return true;
    if (med.freq === 'prn') return false; // PRN handled separately
    if (med.freq === 'weekly' || med.freq === 'days') {
      var dow = now.getDay();
      return Array.isArray(med.days) && med.days.indexOf(dow) !== -1;
    }
    return false;
  }

  /**
   * Computes slots, wait timers, and due status for one person ('gene' or 'peggy').
   */
  function computePersonView(person, now) {
    var nowMs = now.getTime();
    var personSlots = state.slots
      .filter(function (s) { return s.person === person; })
      .sort(function (a, b) { return a.time.localeCompare(b.time); });

    var prnMeds = state.meds.filter(function (m) {
      return m.person === person && m.freq === 'prn';
    });

    var activeWaitUntil = 0;
    var activeWaitMinutes = 0;
    var doneSlots = [];
    var dueSlots = [];
    var laterSlots = [];

    personSlots.forEach(function (slot) {
      var slotMeds = state.meds.filter(function (m) {
        return m.person === person && m.slotId === slot.id && isMedScheduledToday(m, now);
      });
      if (slotMeds.length === 0) return;

      var allTicked = slotMeds.every(function (m) { return !!state.todayLogs[m.id]; });
      var maxTakenTs = 0;
      var lastTakenAt = '';

      slotMeds.forEach(function (m) {
        var log = state.todayLogs[m.id];
        if (log && log.ts >= maxTakenTs) {
          maxTakenTs = log.ts;
          lastTakenAt = log.takenAt;
        }
      });

      if (allTicked) {
        doneSlots.push({ slot: slot, takenAt: lastTakenAt });
        if (slot.waitMinutes && maxTakenTs > 0) {
          var waitUntil = maxTakenTs + slot.waitMinutes * 60000;
          if (nowMs < waitUntil && waitUntil > activeWaitUntil) {
            activeWaitUntil = waitUntil;
            activeWaitMinutes = slot.waitMinutes;
          }
        }
        return;
      }

      var baseMs = parseTodayTime(now, slot.time);
      var effectiveMs = Math.max(baseMs, activeWaitUntil);
      var entry = {
        slot: slot,
        meds: slotMeds,
        effectiveMs: effectiveMs,
        effectiveTimeStr: formatClock(new Date(effectiveMs)),
        isDue: nowMs >= effectiveMs
      };

      if (entry.isDue) {
        dueSlots.push(entry);
      } else {
        laterSlots.push(entry);
      }
    });

    // If nothing is due right now, show the very next upcoming slot (like mockup Gene 9:02)
    var visibleSlots = dueSlots.slice();
    var remainingLater = laterSlots.slice();
    if (visibleSlots.length === 0 && remainingLater.length > 0) {
      visibleSlots.push(remainingLater.shift());
    }

    return {
      doneSlots: doneSlots,
      activeWaitUntil: activeWaitUntil,
      activeWaitMinutes: activeWaitMinutes,
      dueSlots: dueSlots,
      visibleSlots: visibleSlots,
      laterSlots: remainingLater,
      prnMeds: prnMeds
    };
  }

  function updateAutoView(geneView, peggyView) {
    var dueIds = [];
    geneView.dueSlots.forEach(function (d) { dueIds.push('g:' + d.slot.id); });
    peggyView.dueSlots.forEach(function (d) { dueIds.push('p:' + d.slot.id); });
    var dueKey = dueIds.join(',');

    if (dueKey) {
      if (state.manualView === 'photos' && state.dismissedDueKey === dueKey) {
        state.view = 'photos';
      } else {
        state.manualView = null;
        state.dismissedDueKey = '';
        state.view = 'meds';
      }
    } else {
      state.dismissedDueKey = '';
      if (state.manualView === 'meds') {
        state.view = 'meds';
      } else {
        state.view = 'photos';
      }
    }
    return dueKey;
  }

  function renderMedRow(med, isPrn) {
    var log = state.todayLogs[med.id];
    var onClass = log ? ' on' : '';
    var checkMark = log ? '✓' : '';
    var details = [];
    if (med.dose) details.push(med.dose);
    if (med.note) details.push(med.note);
    if (log && log.takenAt) {
      details.push((isPrn ? 'last used ' : 'taken ') + formatHHMM12(log.takenAt));
    }
    var title = med.name + (med.strength ? ' ' + med.strength : '');
    var warnHtml = med.warning
      ? '<div class="warn">⚠ ' + esc(med.warning) + '</div>'
      : '';

    return (
      '<div class="med" data-med-id="' + esc(med.id) + '">' +
        '<div class="box' + onClass + '">' + checkMark + '</div>' +
        '<div class="med-body">' +
          '<div class="mname">' + esc(title) + '</div>' +
          '<div class="mdose">' + esc(details.join(' · ')) + '</div>' +
          warnHtml +
        '</div>' +
      '</div>'
    );
  }

  function renderColumn(person, label, pView) {
    var html = '<div class="col ' + person + '">';
    html += '<div class="name">' + label + '</div>';

    var hasAny = pView.doneSlots.length || pView.visibleSlots.length ||
      pView.laterSlots.length || pView.prnMeds.length;

    if (!hasAny) {
      html += '<div class="empty-msg">No medications scheduled yet.</div>';
      return html + '</div>';
    }

    pView.doneSlots.forEach(function (d) {
      html += '<div class="done">✓ ' + esc(d.slot.name) + ': done at ' +
        esc(formatHHMM12(d.takenAt)) + '</div>';
    });

    if (pView.activeWaitUntil > 0) {
      var hrs = Math.round(pView.activeWaitMinutes / 60 * 10) / 10;
      var waitLabel = hrs === 2 ? '2-hour wait' : (pView.activeWaitMinutes + '-min wait');
      html += '<div class="wait">⏳ Next meds at <b>' +
        esc(formatClock(new Date(pView.activeWaitUntil))) +
        '</b> (' + esc(waitLabel) + ')</div>';
    }

    pView.visibleSlots.forEach(function (entry) {
      html += '<div class="slot">' + esc(entry.slot.name) +
        ' <span>' + esc(entry.effectiveTimeStr) + '</span></div>';
      if (entry.slot.note) {
        html += '<div class="slot-note">' + esc(entry.slot.note) + '</div>';
      }
      entry.meds.forEach(function (m) {
        html += renderMedRow(m, false);
      });
    });

    if (pView.laterSlots.length > 0) {
      var parts = pView.laterSlots.map(function (l) {
        return esc(l.slot.name) + ' ' + esc(l.effectiveTimeStr) + ' (' + l.meds.length + ')';
      });
      html += '<div class="later">Later: ' + parts.join(' · ') + '</div>';
    }

    if (pView.prnMeds.length > 0) {
      html += '<div class="prn-wrap"><div class="prn-title">As Needed</div>';
      pView.prnMeds.forEach(function (m) {
        html += renderMedRow(m, true);
      });
      html += '</div>';
    }

    return html + '</div>';
  }

  function render() {
    var now = new Date();
    var geneView = computePersonView('gene', now);
    var peggyView = computePersonView('peggy', now);
    var dueKey = updateAutoView(geneView, peggyView);
    var app = document.getElementById('app');

    if (state.view === 'photos') {
      var bannerText = '';
      if (peggyView.dueSlots.length > 0) {
        bannerText = '💊 Peggy: ' + peggyView.dueSlots[0].slot.name + ' meds now';
      } else if (geneView.dueSlots.length > 0) {
        bannerText = '💊 Gene: ' + geneView.dueSlots[0].slot.name + ' meds now';
      }
      var bannerHtml = bannerText
        ? '<div class="banner" id="open-meds-banner"><div>' + esc(bannerText) +
          '</div><div class="go">Open meds</div></div>'
        : '';

      app.innerHTML =
        '<div class="screen-photos">' +
          '<div class="ph-label">Family photo slideshow<br><span style="font-size:22px;font-weight:600;opacity:.85">(Drive photos added in Step 4)</span></div>' +
          '<div class="ph-clock">' +
            '<div class="time">' + esc(formatClock(now)) + '</div>' +
            '<div class="date">' + esc(formatDateLine(now)) + '</div>' +
          '</div>' +
          '<div class="ph-actions">' +
            '<button class="btn call" id="btn-call">📞 Call Tom</button>' +
            '<button class="btn photos" id="btn-to-meds">Meds</button>' +
          '</div>' +
          bannerHtml +
        '</div>';
    } else {
      app.innerHTML =
        '<div class="screen-meds">' +
          '<div class="top">' +
            '<div class="day">' + esc(formatDateLine(now)) + '</div>' +
            '<div class="clock">' + esc(formatClock(now)) + '</div>' +
          '</div>' +
          '<div class="cols">' +
            renderColumn('gene', 'Gene', geneView) +
            renderColumn('peggy', 'Peggy', peggyView) +
          '</div>' +
          '<div class="foot">' +
            '<button class="btn call" id="btn-call">📞 Call Tom</button>' +
            '<button class="btn photos" id="btn-to-photos">Photos</button>' +
            '<button class="btn edit" id="btn-edit">Edit Meds</button>' +
          '</div>' +
        '</div>';
    }

    bindEvents(dueKey);
  }

  function bindEvents(dueKey) {
    var medEls = document.querySelectorAll('.med[data-med-id]');
    for (var i = 0; i < medEls.length; i++) {
      medEls[i].addEventListener('click', onMedTap);
    }

    var toPhotos = document.getElementById('btn-to-photos');
    if (toPhotos) {
      toPhotos.addEventListener('click', function () {
        state.manualView = 'photos';
        state.dismissedDueKey = dueKey;
        state.view = 'photos';
        render();
      });
    }

    var toMeds = document.getElementById('btn-to-meds');
    if (toMeds) {
      toMeds.addEventListener('click', function () {
        state.manualView = 'meds';
        state.view = 'meds';
        render();
      });
    }

    var banner = document.getElementById('open-meds-banner');
    if (banner) {
      banner.addEventListener('click', function () {
        state.manualView = null;
        state.dismissedDueKey = '';
        state.view = 'meds';
        render();
      });
    }

    var callBtn = document.getElementById('btn-call');
    if (callBtn) {
      callBtn.addEventListener('click', function () {
        showToast('Call Tom button comes in Step 5');
      });
    }

    var editBtn = document.getElementById('btn-edit');
    if (editBtn) {
      editBtn.addEventListener('click', function () {
        showToast('Edit Meds comes in Step 2c');
      });
    }
  }

  function onMedTap(e) {
    var medId = e.currentTarget.getAttribute('data-med-id');
    if (!medId) return;

    var prev = state.todayLogs[medId];
    var now = new Date();
    if (prev) {
      delete state.todayLogs[medId];
    } else {
      var h = String(now.getHours()).padStart(2, '0');
      var m = String(now.getMinutes()).padStart(2, '0');
      state.todayLogs[medId] = { takenAt: h + ':' + m, ts: now.getTime() };
    }
    render();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.todayLogs) {
            state.todayLogs = res.todayLogs;
            state.todayKey = res.todayKey;
            render();
          }
        })
        .withFailureHandler(function () {
          if (prev) state.todayLogs[medId] = prev;
          else delete state.todayLogs[medId];
          render();
          showToast('Could not save — please tap again');
        })
        .apiToggleDose(medId, state.todayKey);
    }
  }

  function loadState() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return;
          state.slots = res.slots || [];
          state.meds = res.meds || [];
          state.todayLogs = res.todayLogs || {};
          state.todayKey = res.todayKey || '';
          render();
        })
        .withFailureHandler(function () {
          showToast('Connection error — retrying');
        })
        .apiGetState();
    } else {
      render();
    }
  }

  loadState();
  setInterval(render, 15000);
  setInterval(loadState, 60000);
})();
</script>
