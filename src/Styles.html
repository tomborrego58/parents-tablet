<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #241773;
    color: #1b1b1b;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .loading {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: #555;
  }

  /* Shared Top & Bottom Bars */
  .screen-meds, .screen-edit {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .top {
    height: 74px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: #fff;
    border-bottom: 2px solid #e2ddd2;
    gap: 12px;
  }
  .top-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .top .clock { font-size: 36px; font-weight: 800; white-space: nowrap; }
  .top .day { font-size: 26px; font-weight: 700; white-space: nowrap; }

  .top-call-bar {
    flex: none;
    padding: 8px 20px;
    background: #fff;
    border-bottom: 2px solid #e2ddd2;
  }
  .top-call-bar .foot-row {
    height: 54px;
  }
  body.dark .top-call-bar {
    background: #121212;
    border-color: #2c2c2c;
  }
  .main-tabs {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    background: #ebe6db;
    border-bottom: 2px solid #d7d0c2;
  }
  .main-tab {
    flex: 1;
    border: 3px solid #444;
    background: #fff;
    color: #1b1b1b;
    border-radius: 16px;
    padding: 20px 10px;
    min-height: 82px;
    font-family: inherit;
    font-size: 25px;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .todo-done { text-decoration: line-through; opacity: 0.55; }
  .main-tab.on {
    background: #2f5fb3;
    color: #fff;
    border-color: #2f5fb3;
  }
  body.dark .main-tabs { background: #1a1a1a; border-color: #2c2c2c; }
  body.dark .main-tab { background: #121212; color: #f5f5f5; border-color: #555; }
  body.dark .main-tab.on { background: #241773; border-color: #9e7c0c; color: #fff; }

  .call-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    padding: 20px;
  }
  .call-card {
    height: 110px;
    border-radius: 20px;
    font-size: 28px;
  }

  .foot {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 18px 12px;
    background: #fff;
    border-top: 2px solid #e2ddd2;
  }
  .foot-row {
    display: flex;
    gap: 10px;
    height: 62px;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: 23px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #fff;
    cursor: pointer;
    padding: 0 10px;
    min-width: 0;
  }
  .btn:active { opacity: 0.85; }
  .call { background: #1f8a3b; }
  .call-katie { background: #0f766e; }
  .call-laura { background: #7c3aed; }
  .call-matt { background: #b45309; }
  .call-others { background: #374151; }
  .photos { background: #2f5fb3; }
  .edit { background: #5b5b5b; }
  .red { background: #c62828; }
  .amber { background: #e0b100; color: #1b1b1b; }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.75);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    flex: none;
    overflow: hidden;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Alarm Snooze Bar */
  .alarm-bar {
    flex: none;
    background: #ffd34d;
    border-bottom: 3px solid #d49b00;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-size: 26px;
    font-weight: 800;
  }
  .alarm-bar .snooze-btn {
    background: #1b1b1b;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    font-family: inherit;
    font-size: 24px;
    font-weight: 800;
    cursor: pointer;
  }

  /* Screen A: Meds Columns */
  .cols {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 18px;
    padding: 16px 20px;
  }
  .col {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #fff;
    border-radius: 20px;
    padding: 16px 18px;
    border: 3px solid transparent;
  }
  .gene { border-color: #2f5fb3; }
  .peggy { border-color: #8a3fa8; }
  .col-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .name { font-size: 36px; font-weight: 800; margin-bottom: 0; }
  .gene .name { color: #2f5fb3; }
  .peggy .name { color: #8a3fa8; }
  .clear-btn {
    border: 2px solid #bbb;
    background: #f8f6f0;
    color: #333;
    border-radius: 10px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
  }
  .clear-btn:active { background: #e8e3d8; }

  .done-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 2px solid #eee;
  }
  .done-text {
    font-size: 24px;
    color: #1b1b1b;
    font-weight: 800;
  }
  .expand-btn {
    border: none;
    background: transparent;
    color: #2f5fb3;
    font-family: inherit;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }
  .done-list {
    padding: 4px 0 8px 0;
    border-bottom: 2px solid #eee;
  }
  .done-med {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 3px 4px;
    border-radius: 8px;
    cursor: pointer;
  }
  .done-med:active { background: #f3efe6; }
  .done-check {
    color: #1f8a3b;
    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    flex: none;
  }
  .settings-grid {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .settings-col {
    flex: 1;
    min-width: 280px;
  }
  .settings-divider {
    border: none;
    border-top: 3px solid #d7d0c2;
    margin: 24px 0 14px;
  }
  body.dark .settings-divider { border-top-color: #2c2c2c; }
  .meet-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .meet-row .name-in { width: 120px; flex: none; }
  .meet-row .url-in { flex: 1; min-width: 180px; }
  .meet-row .photo-in { width: 170px; flex: none; }

  /* Dark Mode (Black background + Ravens accents) */
  body.dark {
    background: #000000;
    color: #f5f5f5;
  }
  body.dark .top,
  body.dark .foot,
  body.dark .col,
  body.dark .item,
  body.dark .hist,
  body.dark .dlg .c {
    background: #121212;
    color: #f5f5f5;
    border-color: #2c2c2c;
  }
  body.dark .gene { border-color: #4f86f7; }
  body.dark .peggy { border-color: #9e7c0c; }
  body.dark .gene .name { color: #6ea3ff; }
  body.dark .peggy .name { color: #d8a6ff; }
  body.dark .tabs { background: #1a1a1a; border-color: #2c2c2c; }
  body.dark .tab { background: #121212; color: #f5f5f5; border-color: #555; }
  body.dark .tab.on { background: #241773; border-color: #9e7c0c; color: #fff; }
  body.dark .field { background: #1c1c1c; color: #fff; border-color: #555; }
  body.dark .done-text,
  body.dark .mname,
  body.dark .slot { color: #f5f5f5; }
  body.dark .mdose,
  body.dark .slot span,
  body.dark .later,
  body.dark .item .d,
  body.dark .prn-title { color: #bdbdbd; }
  body.dark .done-row,
  body.dark .done-list,
  body.dark .later { border-color: #2c2c2c; }
  body.dark .med:active,
  body.dark .done-med:active { background: #222; }
  body.dark .box { background: #1c1c1c; border-color: #888; }
  body.dark .box.on { background: #1f8a3b; border-color: #1f8a3b; }
  body.dark .clear-btn { background: #1c1c1c; color: #f5f5f5; border-color: #555; }
  body.dark .wait { background: #2d2300; border-color: #9e7c0c; color: #ffd34d; }
  body.dark .warn { background: #3b1010; border-color: #ef5350; color: #ffcdd2; }
  body.dark .pill { background: #1c1c1c; color: #8ab4f8; border-color: #4f86f7; }
  body.dark .pill.on { background: #241773; color: #fff; border-color: #9e7c0c; }
  .ravens-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #241773;
    border: 2px solid #9e7c0c;
    border-radius: 12px;
    padding: 4px 10px;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .wait {
    margin: 10px 0;
    background: #fff4d6;
    border: 2px solid #e0b100;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 24px;
    font-weight: 700;
  }
  .slot {
    font-size: 26px;
    font-weight: 800;
    margin: 14px 0 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .slot span { color: #666; font-weight: 700; }
  .slot-note { font-size: 19px; color: #555; margin-bottom: 6px; font-weight: 600; }

  .med {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 10px 6px;
    border-radius: 12px;
    cursor: pointer;
  }
  .med:active { background: #f3efe6; }
  .box {
    width: 50px;
    height: 50px;
    border: 4px solid #444;
    border-radius: 10px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: #fff;
    font-weight: 900;
    background: #fff;
    margin-top: 2px;
  }
  .box.on { background: #1f8a3b; border-color: #1f8a3b; }
  .med-body { flex: 1; min-width: 0; }
  .mname { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .mdose { font-size: 20px; color: #444; margin-top: 2px; }
  .warn {
    background: #fde8e8;
    border: 2px solid #c62828;
    color: #8e1515;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 18px;
    font-weight: 700;
    margin-top: 6px;
  }

  .later {
    font-size: 22px;
    color: #555;
    padding: 10px 0 4px;
    border-top: 2px solid #eee;
    margin-top: 10px;
  }
  .prn-wrap {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 2px dashed #ddd;
  }
  .prn-title {
    font-size: 22px;
    font-weight: 800;
    color: #555;
    margin-bottom: 4px;
  }
  .empty-msg {
    font-size: 22px;
    color: #666;
    padding: 16px 0;
    line-height: 1.4;
  }

  /* Screen C: Photos full screen */
  .screen-photos {
    position: relative;
    height: 100%;
    width: 100%;
    background: linear-gradient(135deg, #d9a46a, #8d6e9e 55%, #4a7a9a);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .ph-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #111;
  }
  .ph-label {
    color: rgba(255, 255, 255, 0.9);
    font-size: 34px;
    font-weight: 700;
    text-align: center;
    padding: 0 32px;
  }
  .ph-clock {
    position: absolute;
    top: 22px;
    left: 28px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
    z-index: 2;
  }
  .ph-clock .time { font-size: 64px; font-weight: 800; line-height: 1.05; }
  .ph-clock .date { font-size: 30px; font-weight: 700; margin-top: 4px; }
  .sound-pill {
    display: inline-block;
    margin-top: 10px;
    background: rgba(0, 0, 0, 0.65);
    color: #ffd34d;
    border: 2px solid #ffd34d;
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
  }
  .ph-actions {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    gap: 12px;
    z-index: 2;
  }
  .ph-actions .btn {
    flex: none;
    padding: 16px 22px;
    font-size: 24px;
  }
  .banner {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 24px;
    height: 112px;
    border-radius: 22px;
    background: #ffd34d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 32px;
    font-weight: 800;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    z-index: 3;
  }
  .banner .go {
    background: #1b1b1b;
    color: #fff;
    border-radius: 16px;
    padding: 14px 26px;
    font-size: 26px;
    flex: none;
  }

  /* Screen E: Edit Meds / History / Settings */
  .tabs {
    display: flex;
    gap: 10px;
    padding: 12px 20px;
    background: #ebe6db;
    border-bottom: 2px solid #d7d0c2;
    flex: none;
    flex-wrap: wrap;
  }
  .tab {
    border: 3px solid #444;
    background: #fff;
    color: #1b1b1b;
    border-radius: 14px;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
  }
  .tab.on { background: #1b1b1b; color: #fff; border-color: #1b1b1b; }
  .edit-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 24px 36px;
    user-select: text;
  }
  .sec-title { font-size: 28px; font-weight: 800; margin: 16px 0 10px; }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-radius: 16px;
    border: 3px solid #ddd;
    padding: 12px 16px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .item .n { font-size: 24px; font-weight: 800; flex: 1; min-width: 220px; }
  .item .d { font-size: 19px; color: #444; font-weight: 600; }
  .sm-btn {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-family: inherit;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
  }
  .sm-btn.blue { background: #2f5fb3; }
  .sm-btn.red { background: #c62828; }
  .sm-btn.green { background: #1f8a3b; }
  .sm-btn.amber { background: #e0b100; color: #1b1b1b; }

  .who { display: flex; gap: 16px; margin-bottom: 14px; }
  .who button {
    flex: 1;
    height: 74px;
    border-radius: 18px;
    font-family: inherit;
    font-size: 34px;
    font-weight: 900;
    border: 4px solid;
    background: #fff;
    cursor: pointer;
  }
  .who .g { border-color: #2f5fb3; color: #2f5fb3; }
  .who .g.on { background: #2f5fb3; color: #fff; }
  .who .pg { border-color: #8a3fa8; color: #8a3fa8; }
  .who .pg.on { background: #8a3fa8; color: #fff; }

  .lbl { font-size: 22px; font-weight: 800; margin: 14px 0 6px; }
  .field {
    width: 100%;
    background: #fff;
    border: 3px solid #444;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 24px;
    font-weight: 700;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  .pill {
    display: inline-flex;
    align-items: center;
    border: 3px solid #2f5fb3;
    border-radius: 14px;
    padding: 10px 18px;
    margin: 0 10px 10px 0;
    font-family: inherit;
    font-size: 22px;
    font-weight: 800;
    color: #2f5fb3;
    background: #fff;
    cursor: pointer;
  }
  .pill.on { background: #2f5fb3; color: #fff; }

  .hist {
    background: #fff;
    border-radius: 14px;
    border: 2px solid #ddd;
    padding: 12px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    font-size: 22px;
  }

  /* Modal Dialog */
  .dlg {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .dlg .c {
    background: #fff;
    border-radius: 24px;
    padding: 32px 36px;
    max-width: 720px;
    width: 100%;
    text-align: center;
  }
  .dlg .q { font-size: 34px; font-weight: 800; margin-bottom: 10px; }
  .dlg .s { font-size: 24px; color: #444; margin-bottom: 24px; }
  .dlg .bb { display: flex; gap: 16px; }
  .dlg .bb .btn { height: 80px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 124px;
    transform: translateX(-50%);
    background: #1b1b1b;
    color: #fff;
    padding: 14px 24px;
    border-radius: 14px;
    font-size: 22px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 99;
  }
  .toast.show { opacity: 0.95; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .screen-meds, .screen-edit { height: auto; min-height: 100%; }
    .top { padding: 8px 16px; height: auto; min-height: 64px; flex-wrap: wrap; }
    .top .clock { font-size: 28px; }
    .top .day { font-size: 20px; white-space: normal; }
    .main-tabs { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
    .main-tab { flex: 1 1 18%; min-height: 66px; font-size: 19px; padding: 10px 8px; }
    .cols { flex-direction: column; padding: 12px; gap: 14px; }
    .col { overflow: visible; }
    .foot { position: sticky; bottom: 0; height: auto; padding: 8px 12px; gap: 8px; }
    .foot-row { height: auto; flex-wrap: wrap; gap: 8px; }
    .foot-row .btn { min-width: 18%; height: 56px; font-size: 18px; border-radius: 14px; padding: 0 8px; }
    .avatar { width: 28px; height: 28px; font-size: 15px; }
    .ph-clock .time { font-size: 48px; }
    .ph-clock .date { font-size: 22px; }
    .ph-actions { top: auto; bottom: 20px; right: 12px; left: 12px; flex-wrap: wrap; }
    .ph-actions .btn { flex: 1; padding: 12px; font-size: 18px; }
    .banner { bottom: 96px; height: auto; padding: 14px 16px; font-size: 20px; gap: 10px; }
    .banner .go { font-size: 18px; padding: 10px 14px; }
  }

  @media (max-width: 540px) {
    .top .clock { font-size: 22px; }
    .top .day { font-size: 16px; }
    .main-tab { flex: 1 1 30%; min-height: 54px; font-size: 15px; padding: 8px 6px; }
    .foot-row .btn { min-width: 30%; height: 48px; font-size: 15px; }
    .avatar { width: 22px; height: 22px; font-size: 12px; }
  }
</style>
