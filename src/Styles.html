<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f4f1ea;
    color: #1b1b1b;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .loading {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: #555;
  }

  /* Screen A: Meds */
  .screen-meds {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .top {
    height: 76px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #fff;
    border-bottom: 2px solid #e2ddd2;
  }
  .top .day { font-size: 30px; font-weight: 700; }
  .top .clock { font-size: 40px; font-weight: 800; }

  .cols {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 18px;
    padding: 16px 20px;
  }
  .col {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background: #fff;
    border-radius: 20px;
    padding: 16px 18px;
    border: 3px solid transparent;
  }
  .gene { border-color: #2f5fb3; }
  .peggy { border-color: #8a3fa8; }
  .name { font-size: 36px; font-weight: 800; margin-bottom: 10px; }
  .gene .name { color: #2f5fb3; }
  .peggy .name { color: #8a3fa8; }

  .done {
    font-size: 24px;
    color: #1f8a3b;
    font-weight: 700;
    padding: 8px 0;
    border-bottom: 2px solid #eee;
  }
  .wait {
    margin: 10px 0;
    background: #fff4d6;
    border: 2px solid #e0b100;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 24px;
    font-weight: 700;
  }
  .slot {
    font-size: 26px;
    font-weight: 800;
    margin: 14px 0 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .slot span { color: #666; font-weight: 700; }
  .slot-note { font-size: 19px; color: #555; margin-bottom: 6px; font-weight: 600; }

  .med {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 10px 6px;
    border-radius: 12px;
    cursor: pointer;
  }
  .med:active { background: #f3efe6; }
  .box {
    width: 50px;
    height: 50px;
    border: 4px solid #444;
    border-radius: 10px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: #fff;
    font-weight: 900;
    background: #fff;
    margin-top: 2px;
  }
  .box.on { background: #1f8a3b; border-color: #1f8a3b; }
  .med-body { flex: 1; min-width: 0; }
  .mname { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .mdose { font-size: 20px; color: #444; margin-top: 2px; }
  .warn {
    background: #fde8e8;
    border: 2px solid #c62828;
    color: #8e1515;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 18px;
    font-weight: 700;
    margin-top: 6px;
  }

  .later {
    font-size: 22px;
    color: #555;
    padding: 10px 0 4px;
    border-top: 2px solid #eee;
    margin-top: 10px;
  }
  .prn-wrap {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 2px dashed #ddd;
  }
  .prn-title {
    font-size: 22px;
    font-weight: 800;
    color: #555;
    margin-bottom: 4px;
  }
  .empty-msg {
    font-size: 22px;
    color: #666;
    padding: 16px 0;
    line-height: 1.4;
  }

  .foot {
    height: 104px;
    flex: none;
    display: flex;
    gap: 16px;
    padding: 14px 20px;
    background: #fff;
    border-top: 2px solid #e2ddd2;
  }
  .btn {
    flex: 1;
    border: none;
    border-radius: 18px;
    font-family: inherit;
    font-size: 30px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #fff;
    cursor: pointer;
  }
  .btn:active { opacity: 0.85; }
  .call { background: #1f8a3b; }
  .photos { background: #2f5fb3; }
  .edit { background: #5b5b5b; flex: 0.7; }

  /* Screen C: Photos full screen */
  .screen-photos {
    position: relative;
    height: 100%;
    width: 100%;
    background: linear-gradient(135deg, #d9a46a, #8d6e9e 55%, #4a7a9a);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ph-label {
    color: rgba(255, 255, 255, 0.88);
    font-size: 34px;
    font-weight: 700;
    text-align: center;
    padding: 0 32px;
  }
  .ph-clock {
    position: absolute;
    top: 22px;
    left: 28px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  .ph-clock .time { font-size: 64px; font-weight: 800; line-height: 1.05; }
  .ph-clock .date { font-size: 30px; font-weight: 700; margin-top: 4px; }
  .ph-actions {
    position: absolute;
    top: 28px;
    right: 28px;
    display: flex;
    gap: 14px;
  }
  .ph-actions .btn {
    flex: none;
    padding: 18px 28px;
  }
  .banner {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 24px;
    height: 120px;
    border-radius: 22px;
    background: #ffd34d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    font-size: 34px;
    font-weight: 800;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  .banner .go {
    background: #1b1b1b;
    color: #fff;
    border-radius: 16px;
    padding: 16px 28px;
    font-size: 28px;
    flex: none;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 124px;
    transform: translateX(-50%);
    background: #1b1b1b;
    color: #fff;
    padding: 14px 24px;
    border-radius: 14px;
    font-size: 22px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 99;
  }
  .toast.show { opacity: 0.95; }

  /* Phone portrait support for Tom */
  @media (max-width: 820px) {
    body { overflow: auto; }
    .screen-meds { height: auto; min-height: 100%; }
    .top { padding: 0 16px; height: 64px; }
    .top .day { font-size: 20px; }
    .top .clock { font-size: 26px; }
    .cols { flex-direction: column; padding: 12px; gap: 14px; }
    .col { overflow: visible; }
    .foot { position: sticky; bottom: 0; height: 82px; padding: 10px 12px; gap: 10px; }
    .btn { font-size: 20px; border-radius: 14px; }
    .ph-clock .time { font-size: 44px; }
    .ph-clock .date { font-size: 20px; }
    .ph-actions { top: auto; bottom: 24px; right: 16px; left: 16px; justify-content: center; }
    .ph-actions .btn { flex: 1; padding: 14px 16px; }
    .banner { bottom: 104px; height: auto; padding: 16px 18px; font-size: 22px; gap: 12px; }
    .banner .go { font-size: 20px; padding: 10px 16px; }
  }
</style>
